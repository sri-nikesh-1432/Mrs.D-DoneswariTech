<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shruthi — AI Educational Counselor</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- ── TOP NAVIGATION ─────────────────────────────────────────────────── -->
  <nav class="navbar">
    <div class="nav-brand">
      <div class="nav-logo">
        <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="20" cy="20" r="20" fill="url(#logoGrad)"/>
          <path d="M13 20C13 16.13 16.13 13 20 13s7 3.13 7 7v4a2 2 0 01-2 2h-1v-5h2v-1c0-3.31-2.69-6-6-6s-6 2.69-6 6v1h2v5h-1a2 2 0 01-2-2v-4z" fill="white"/>
          <defs>
            <linearGradient id="logoGrad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
              <stop stop-color="#4F46E5"/>
              <stop offset="1" stop-color="#06B6D4"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <div class="nav-title">
        <span class="brand-name">Shruthi</span>
        <span class="brand-sub">AI Educational Counselor</span>
      </div>
    </div>
    <div class="nav-right">
      <button class="voice-toggle-btn" id="voiceToggleBtn">🎤 Start Voice</button>
      <div class="nav-status">
        <span class="status-dot" id="statusDot"></span>
        <span class="status-text" id="statusText">Connecting...</span>
      </div>
    </div>
  </nav>

  <!-- ── MAIN LAYOUT ────────────────────────────────────────────────────── -->
  <main class="main-layout">

    <!-- LEFT PANEL: Avatar + Controls -->
    <aside class="agent-panel">
      <div class="agent-card glass-card">

        <!-- Avatar -->
        <div class="avatar-container" id="avatarContainer">
          <div class="avatar-rings">
            <div class="ring ring-1"></div>
            <div class="ring ring-2"></div>
            <div class="ring ring-3"></div>
          </div>
          <div class="avatar-circle" id="avatarCircle">
            <svg class="avatar-icon" viewBox="0 0 80 80" fill="none">
              <circle cx="40" cy="40" r="40" fill="url(#avatarGrad)"/>
              <circle cx="40" cy="30" r="12" fill="white" opacity="0.9"/>
              <path d="M16 68c0-13.25 10.75-24 24-24s24 10.75 24 24" fill="white" opacity="0.9"/>
              <defs>
                <linearGradient id="avatarGrad" x1="0" y1="0" x2="80" y2="80">
                  <stop stop-color="#4F46E5"/>
                  <stop offset="1" stop-color="#06B6D4"/>
                </linearGradient>
              </defs>
            </svg>
          </div>
        </div>

        <!-- Agent Info -->
        <div class="agent-info">
          <h2 class="agent-name">Shruthi</h2>
          <p class="agent-role">Educational Counselor</p>
        </div>

        <!-- State Display -->
        <div class="state-display" id="stateDisplay">
          <div class="state-idle active" id="stateIdle">
            <span class="state-icon">👋</span>
            <span>Ready to help</span>
          </div>
          <div class="state-listening" id="stateListening">
            <div class="mic-wave">
              <span></span><span></span><span></span><span></span><span></span>
            </div>
            <span>Listening...</span>
          </div>
          <div class="state-thinking" id="stateThinking">
            <div class="thinking-dots">
              <span></span><span></span><span></span>
            </div>
            <span>Thinking...</span>
          </div>
          <div class="state-speaking" id="stateSpeaking">
            <div class="speak-wave">
              <span></span><span></span><span></span><span></span><span></span>
              <span></span><span></span>
            </div>
            <span>Speaking...</span>
          </div>
        </div>

        <!-- Microphone Button -->
        <div class="mic-wrapper">
          <button class="mic-btn" id="micBtn" title="Hold to speak / Click to toggle">
            <div class="mic-glow"></div>
            <svg class="mic-icon" viewBox="0 0 24 24" fill="none">
              <path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z" fill="currentColor"/>
              <path d="M19 10v2a7 7 0 01-14 0v-2M12 19v4M8 23h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
          <p class="mic-hint" id="micHint">Click to start speaking</p>
        </div>

        <!-- Session Controls -->
        <div class="session-controls">
          <button class="ctrl-btn" id="resetBtn" title="Reset conversation">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 12a9 9 0 109-9M3 3v6h6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Reset
          </button>
          <button class="ctrl-btn" id="clearBtn" title="Clear chat display">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/>
            </svg>
            Clear
          </button>
        </div>

      </div>
    </aside>

    <!-- RIGHT PANEL: Chat -->
    <section class="chat-panel">

      <!-- Chat Messages -->
      <div class="chat-messages" id="chatMessages">
        <!-- Welcome message injected by JS -->
      </div>

      <!-- Interrupt Banner -->
      <div class="interrupt-banner" id="interruptBanner">
        <span>🎤 Speak or click mic to interrupt Shruthi</span>
      </div>

      <!-- Input Area -->
      <div class="input-area glass-card">
        <div class="input-row">
          <textarea
            id="textInput"
            class="text-input"
            placeholder="Type your question here..."
            rows="1"
            maxlength="2000"
          ></textarea>
          <div class="input-actions">
            <button class="action-btn mic-action" id="inlineMicBtn" title="Voice input">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z" fill="currentColor"/>
                <path d="M19 10v2a7 7 0 01-14 0v-2M12 19v4M8 23h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
            </button>
            <button class="action-btn send-action" id="sendBtn" title="Send message">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M22 2L11 13M22 2L15 22l-4-9-9-4 20-7z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="input-footer">
          <span class="char-count" id="charCount">0 / 2000</span>
          <span class="input-mode" id="inputMode">Text Mode</span>
        </div>
      </div>

    </section>
  </main>

  <!-- ── AUDIO PLAYER (hidden) ──────────────────────────────────────────── -->
  <audio id="audioPlayer" style="display:none;"></audio>

  <!-- ── TOAST NOTIFICATIONS ───────────────────────────────────────────── -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="script.js"></script>
</body>
</html>
