[build]
  base = "frontend"
  command = "npm install && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Production build talks to Render backend
[context.production.environment]
  VITE_API_URL = "https://d-tech-pid6.onrender.com"
  VITE_WS_URL = "wss://d-tech-pid6.onrender.com"

[[headers]]
  for = "/*"
  [headers.values]
    # The voice WebSocket and REST CORS headers
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET,POST,PUT,PATCH,DELETE,OPTIONS"
    Access-Control-Allow-Headers = "Content-Type,Authorization,X-Requested-With,Accept"
    Access-Control-Max-Age = "86400"
    Vary = "Origin"

# Reverse-proxy API calls directly to Render backend
[[redirects]]
  from = "/api/*"
  to = "https://d-tech-pid6.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "https://d-tech-pid6.onrender.com/health"
  status = 200
  force = true

# SPA fallback: all client-side routes (e.g. /agents, /settings) serve index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
