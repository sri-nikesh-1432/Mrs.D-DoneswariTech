[build]
  base = "frontend"
  command = "npm install && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback: all client-side routes (e.g. /signup, /agents) serve index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Do not cache the service-worker-free index so deploys always serve fresh JS.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"